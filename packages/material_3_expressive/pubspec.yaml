name: material_3_expressive
description: >-
  A faithful Flutter implementation of the Material 3 Expressive component set,
  exposed as direct M3E component widgets.
version: 1.1.2
homepage: https://github.com/paadevelopments/material_3_expressive
repository: https://github.com/paadevelopments/material_3_expressive
issue_tracker: https://github.com/paadevelopments/material_3_expressive/issues

topics:
  - ui
  - material-design
  - widgets
  - components

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  collection: ^1.19.1
  dynamic_color: 1.7.0
  flutter:
    sdk: flutter
  material_new_shapes:
    path: ../material_new_shapes
  material_ui:
    path: ../material_ui
  motor:
    path: ../motor

dev_dependencies:
  custom_lint: ^0.7.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  klin_dart: ^1.3.1
  material_color_utilities: ^0.13.0